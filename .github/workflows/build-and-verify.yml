name: Build and Verify Soroban Contract

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  build:
    name: Build and Attest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config

      - name: Install Stellar CLI
        run: cargo install stellar-cli --locked

      - name: Check Stellar CLI version
        run: stellar --version

      - name: Build contract with SEP-55 metadata
        run: |
          stellar contract build --optimize \
            --meta source_repo=github:${{ github.repository }}

      - name: Verify build metadata
        run: |
          stellar contract info meta \
            --wasm target/wasm32v1-none/release/privacy_pool.wasm

      - name: Generate build attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: target/wasm32v1-none/release/privacy_pool.wasm

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: privacy_pool-contract
          path: target/wasm32v1-none/release/privacy_pool.wasm

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/wasm32v1-none/release/privacy_pool.wasm
          generate_release_notes: true
